# Cloudflare Worker 配置文件

name = "unicom-token-generate"
main = "worker.ts"
compatibility_date = "2024-12-01"

# Worker 设置
workers_dev = true

# 兼容性标志
[build]
command = ""

# 支持导入文本文件（HTML、CSS等）
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css"]
fallthrough = true

# 环境变量（如果需要）
[vars]
# 在这里添加环境变量

# 路由配置（部署到自定义域名时使用）
# [[routes]]
# pattern = "example.com/*"
# zone_name = "example.com"

