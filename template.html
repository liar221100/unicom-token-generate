<!DOCTYPE html>
<html>
  <head>
    <title>联通Token获取工具</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: 'Segoe UI', Roboto, sans-serif;
        padding: 20px;
        background: #f4f6f9;
        color: #333;
      }

      .container {
        max-width: 550px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }

      h2 {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 25px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #555;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box;
        transition: 0.3s;
      }

      input:focus {
        border-color: #007bff;
        outline: none;
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.2);
      }

      button.login-btn {
        width: 100%;
        padding: 12px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        margin-top: 10px;
      }

      button.login-btn:hover {
        background: #0056b3;
      }

      .result {
        margin-top: 25px;
        padding: 20px;
        background: #e8f5e9;
        border-radius: 10px;
        border-left: 5px solid #4caf50;
      }

      .result h3 {
        margin-top: 0;
        color: #2e7d32;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .warn-label {
        font-size: 13px;
        color: #d32f2f;
        font-weight: bold;
        margin-top: 15px;
        margin-bottom: 5px;
        display: block;
      }

      .code-box {
        background: #2b2b2b;
        color: #fff;
        padding: 15px;
        border-radius: 8px;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 13px;
        line-height: 1.5;
        max-height: 300px;
        overflow-y: auto;
        border: 1px solid #444;
      }

      .copy-btn {
        background: #6c5ce7;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        margin-top: 10px;
        float: right;
        transition: 0.2s;
      }

      .copy-btn:hover {
        background: #5b4cc4;
      }

      .copy-btn:active {
        transform: scale(0.98);
      }

      .error-box {
        background: #ffebee;
        border-left-color: #c62828;
      }

      .error-box h3 {
        color: #c62828;
      }

      #hidden-copy-text {
        position: absolute;
        left: -9999px;
      }

      .remember-me {
        display: flex;
        align-items: center;
        cursor: pointer;
        font-weight: normal;
        margin-top: 5px;
      }

      .remember-me input[type='checkbox'] {
        width: auto;
        margin-right: 8px;
        cursor: pointer;
        margin-top: 0;
      }

      button.login-btn:disabled {
        background: #6c757d;
        cursor: not-allowed;
        opacity: 0.7;
      }

      .loading-spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        display: inline-block;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>联通 Token 获取 v1.0.0</h2>
      <form method="POST">
        <div class="form-group">
          <label>手机号码</label>
          <input type="text" name="phone" id="phone" placeholder="请输入11位手机号" required />
        </div>
        <div class="form-group">
          <label>服务密码</label>
          <input type="password" name="password" id="password" placeholder="联通APP登录密码" required />
        </div>
        <div class="form-group">
          <label class="remember-me">
            <input type="checkbox" id="remember-me" />
            <span>记住账号密码</span>
          </label>
        </div>
        <button type="submit" class="login-btn" id="submit-btn">
          <span class="btn-text">登录并获取Token</span>
        </button>
      </form>

      <!-- 结果区域将通过 JavaScript 动态插入 -->
      <div id="result-container"></div>
    </div>

    <script>
      // 页面加载时恢复保存的账号密码和按钮状态，并显示结果（如果有）
      ;(function () {
        try {
          // 确保按钮处于正常状态
          var btn = document.getElementById('submit-btn')
          if (btn) {
            btn.disabled = false
            var btnText = btn.querySelector('.btn-text')
            if (btnText) {
              btnText.innerHTML = '登录并获取Token'
            }
          }

          // 恢复保存的账号密码
          var savedPhone = localStorage.getItem('unicom_phone')
          var savedPassword = localStorage.getItem('unicom_password')
          var rememberMe = localStorage.getItem('unicom_remember') === 'true'

          if (savedPhone && rememberMe) {
            document.getElementById('phone').value = savedPhone
          }
          if (savedPassword && rememberMe) {
            document.getElementById('password').value = savedPassword
          }
          if (rememberMe) {
            document.getElementById('remember-me').checked = true
          }

          // 从 sessionStorage 读取结果并显示（PRG 模式）
          // var resultData = sessionStorage.getItem('unicom_result')
          // if (resultData) {
          //   try {
          //     var result = JSON.parse(resultData)
          //     var resultContainer = document.getElementById('result-container')

          //     if (result && resultContainer) {
          //       // 重新生成 colored_html（如果需要）
          //       if (result.status === 'success' && result.full_str && !result.colored_html) {
          //         var parts = result.full_str.split('#')
          //         var colors = ['#4facfe', '#ff5858', '#00f260', '#f4d03f', '#e0c3fc']
          //         var htmlParts = parts.map(function (part, i) {
          //           var color = colors[i % colors.length]
          //           return '<span style="color:' + color + '; word-break: break-all;">' + escapeHtml(part) + '</span>'
          //         })
          //         result.colored_html = htmlParts.join('<span style="color:#888; font-weight:bold;">#</span>')
          //       }

          //       // 渲染结果
          //       renderResult(result, resultContainer)
          //     }

          //     // 清除 sessionStorage，确保刷新后不会再次显示
          //     sessionStorage.removeItem('unicom_result')
          //   } catch (err) {
          //     console.error('解析结果数据失败:', err)
          //     sessionStorage.removeItem('unicom_result')
          //   }
          // }
        } catch (err) {
          console.error('初始化失败:', err)
        }
      })()

      // HTML 转义函数
      function escapeHtml(text) {
        var map = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;',
        }
        return String(text).replace(/[&<>"']/g, function (m) {
          return map[m] || m
        })
      }

      // 生成彩色字段标签
      function generateColoredLabel() {
        var labels = ['账号', '密码', 'token_online', 'ecs_token', 'appid']
        var colors = ['#4facfe', '#ff5858', '#00f260', '#f4d03f', '#e0c3fc']
        var coloredLabels = labels.map(function (label, i) {
          return '<span style="color:' + colors[i] + '; font-weight:600;">' + label + '</span>'
        })
        return coloredLabels.join('<span style="color:#888;">#</span>')
      }

      // 渲染结果到页面
      function renderResult(result, container) {
        if (result.status === 'success') {
          container.innerHTML =
            '<div class="result">' +
            '<h3>✅ 获取成功</h3>' +
            '<label class="warn-label">完整数据（' +
            generateColoredLabel() +
            '，尽快保存关闭后无法找回）</label>' +
            '<div class="code-box">' +
            result.colored_html +
            '</div>' +
            '<button class="copy-btn" onclick="copyText()">📋 一键复制完整数据</button>' +
            '<textarea id="hidden-copy-text">' +
            escapeHtml(result.full_str) +
            '</textarea>' +
            '</div>'
        } else {
          container.innerHTML = '<div class="result error-box">' + '<h3>❌ 获取失败</h3>' + '<p>' + escapeHtml(result.msg || '未知错误') + '</p>' + '</div>'
        }
      }

      // 显示 loading 状态
      function showLoading() {
        var btn = document.getElementById('submit-btn')
        var btnText = btn.querySelector('.btn-text')
        btn.disabled = true
        btnText.innerHTML = '<span class="loading-spinner"></span><span class="loading-text">正在登录...</span>'
      }

      // 隐藏 loading 状态（如果表单验证失败）
      function hideLoading() {
        var btn = document.getElementById('submit-btn')
        var btnText = btn.querySelector('.btn-text')
        btn.disabled = false
        btnText.innerHTML = '登录并获取Token'
      }

      // 表单提交时处理记住密码和 loading 状态
      document.querySelector('form').addEventListener('submit', function (e) {
        var form = this
        var rememberMe = document.getElementById('remember-me').checked
        var phone = document.getElementById('phone').value
        var password = document.getElementById('password').value

        // 先检查表单验证
        if (!form.checkValidity()) {
          // 表单验证失败，不显示 loading
          form.reportValidity()
          return
        }

        // 表单验证通过，显示 loading 状态
        showLoading()

        try {
          if (rememberMe && phone && password) {
            // 保存到 localStorage
            localStorage.setItem('unicom_phone', phone)
            localStorage.setItem('unicom_password', password)
            localStorage.setItem('unicom_remember', 'true')
          } else {
            // 清除保存的数据
            localStorage.removeItem('unicom_phone')
            localStorage.removeItem('unicom_password')
            localStorage.removeItem('unicom_remember')
          }
        } catch (err) {
          console.error('保存到本地存储失败:', err)
        }

        // 表单会正常提交，页面会刷新，loading 状态会自然消失
        // 如果提交失败（网络错误等），页面不会刷新，但用户刷新页面时会恢复
      })

      // 取消勾选时清除保存的数据
      document.getElementById('remember-me').addEventListener('change', function (e) {
        if (!e.target.checked) {
          try {
            localStorage.removeItem('unicom_phone')
            localStorage.removeItem('unicom_password')
            localStorage.removeItem('unicom_remember')
          } catch (err) {
            console.error('清除本地存储失败:', err)
          }
        }
      })

      function copyText() {
        var copyText = document.getElementById('hidden-copy-text')
        copyText.select()
        copyText.setSelectionRange(0, 99999)
        try {
          var successful = document.execCommand('copy')
          var btn = document.querySelector('.copy-btn')
          if (successful) {
            btn.innerHTML = '✅ 复制成功！'
            btn.style.background = '#00b894'
            setTimeout(function () {
              btn.innerHTML = '📋 一键复制完整数据'
              btn.style.background = '#6c5ce7'
            }, 2000)
          } else {
            btn.innerHTML = '❌ 复制失败，请手动复制'
          }
        } catch (err) {
          alert('无法自动复制，请手动长按文本框复制')
        }
      }
    </script>
  </body>
</html>
